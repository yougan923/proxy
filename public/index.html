<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proxy</title>
<style>
body {
  font-family: sans-serif;
  text-align: center;
  padding: 40px;
}
input {
  width: 80%;
  padding: 12px;
}
button {
  padding: 12px 20px;
}
</style>
</head>

<body>

<h1>Proxy</h1>

<input id="url" placeholder="URLを入力">

<button onclick="go()">開く</button>

<script>
function go(){
  const url = document.getElementById("url").value;
  location.href = "/proxy?url=" + encodeURIComponent(url);
}
</script>

</body>
</html>
